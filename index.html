<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#214b3c">
<title>巷口商學堂｜從一間果舖，讀懂商業概論</title>
<style>:root{
  --ink:#23372e;--green:#214c3d;--mid:#435b4e;--muted:#5b685e;--rust:#98472c;
  --line:#d9d9c9;--paper:#faf9f4;--surface:#fffef9;--wash:#f2eee0;
  --serif:"Songti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU","Times New Roman",serif;
  --sans:"Inter","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  color-scheme:light;font-family:var(--sans);color:var(--ink);background:var(--paper);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
*{box-sizing:border-box}
body{margin:0;font-size:16px;line-height:1.7}
a{color:inherit;text-decoration:none} button,select{font:inherit}
button,a,summary,select{touch-action:manipulation}
button,summary,select{cursor:pointer} button{color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #ad4c2f;outline-offset:4px}
#main-content:focus,#home-title:focus,.jump-target:focus,.view-title:focus,.quiz-title:focus,.finish-title:focus{outline:none}
[hidden],.sprites{display:none!important}
.skip{position:fixed;z-index:10;left:12px;top:-120px;background:var(--green);color:white;padding:10px 18px}
.skip:focus{top:8px}
.wrap{max-width:1216px;width:calc(100% - 104px);margin:0 auto}
.mast{border-bottom:1px solid #cecfc0;background:#fdfcf7}
.mast-inner{display:flex;align-items:center;gap:17px;min-height:73px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-size:24px;letter-spacing:.06em;font-weight:800;white-space:nowrap;color:var(--green)}
.brand-mark{display:grid;place-items:center;background:var(--green);color:#faf8eb;width:39px;height:39px;border-radius:8px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.brand-mark .ico{width:26px;height:26px;stroke-width:1.45}
.mast-sub{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:17px;letter-spacing:.07em}
.top-nav{margin-left:auto;display:flex;align-items:stretch;gap:26px;align-self:stretch}
.top-nav a{display:inline-flex;gap:8px;align-items:center;justify-content:center;position:relative;font-size:14px;font-weight:650;color:var(--muted);white-space:nowrap}
.top-nav .ico{width:16px;height:16px}
.top-nav a[aria-current="page"]{color:var(--green)}
.top-nav a[aria-current="page"]:after{content:"";position:absolute;bottom:12px;left:0;right:0;height:2px;background:var(--green)}
.top-nav a:hover,.textlink:hover{color:var(--rust)}
.hero{position:relative;display:grid;isolation:isolate;grid-template-columns:1.07fr 1fr;align-items:center;overflow:hidden;min-height:385px;margin:28px 0 37px;border:1px solid #d8d5c2;border-radius:14px;background-color:#f4f1e5;background-image:radial-gradient(#e4dfce 0.55px,transparent 0.75px);background-size:5px 5px}
.hero-copy{padding:43px 0 44px clamp(26px,3.8vw,62px);z-index:1}
.eyebrow,.section-kicker{font-weight:700;font-size:12px;letter-spacing:.11em;color:var(--rust);display:flex;align-items:center;gap:10px}
.ink-line{height:2px;width:24px;background:currentColor;display:inline-block;flex:none}
.small-dot{background:var(--rust);height:3px;width:3px;border-radius:50%}
.hero h1,.map-intro h2,.chapter-title,.lesson-header h1,.chapter-section h2,.challenge h1,.quiz-home h2,.reader-nav h2,.finish-title,.quiz-title{font-family:var(--serif)}
.hero h1{position:relative;font-size:clamp(44px,4.25vw,67px);line-height:1.23;letter-spacing:.035em;margin:15px 0 16px;font-weight:800;color:var(--ink)}
.hero h1 span{color:var(--green)}
.hero-copy>p{max-width:465px;color:#46534b;font-size:16px;line-height:1.9;letter-spacing:.02em;margin:0 16px 22px 0}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:45px;padding:8px 19px;border-radius:6px;border:1px solid transparent;font-weight:650;font-size:15px;line-height:1.45;transition:background .18s,color .18s,border-color .18s}
.btn .ico{width:17px;height:17px}
.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#163d2f}
.outline{background:transparent;border-color:#a5ac96;color:var(--green)}.outline:hover{background:#e6eada;border-color:var(--green)}
.shop-fig{margin:0;position:relative;align-self:stretch;min-width:0;display:flex;align-items:center;justify-content:center;padding:20px 18px 30px 0}
.shop-fig img{display:block;width:100%;height:auto;max-height:365px;object-fit:contain;mix-blend-mode:multiply;filter:contrast(1.07) brightness(1.125);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 96%,transparent)}
.shop-fig figcaption{display:flex;align-items:center;gap:5px;position:absolute;right:27px;bottom:16px;color:#506151;font-size:11px;font-weight:650;letter-spacing:.12em}
.shop-fig figcaption .ico{width:13px;height:13px}
.shop-fig figcaption span{color:#8e9984}
.map-section{margin-bottom:42px}
.map-intro{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:20px}
.section-kicker{color:var(--muted);font-size:11px;letter-spacing:.14em;gap:8px}
.section-kicker .ink-line{width:17px}
.map-intro h2{font-size:clamp(29px,2.3vw,38px);line-height:1.3;letter-spacing:.06em;margin:4px 0 0;color:var(--green)}
.map-progress{margin:0 0 3px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.segment-meter{display:inline-flex;align-items:center;gap:3px}
.segment-meter i{width:10px;height:5px;border-radius:2px;background:#d6d9ca}
.segment-meter i.filled{background:var(--green)}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.unit-card{--accent:#375c45;--tint:#e9eedf;display:flex;gap:0;flex-direction:column;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 23px 17px;min-width:0;transition:border-color .16s,box-shadow .16s,transform .16s}
.sage{--accent:#375c45;--tint:#e6ecdb}
.wheat{--accent:#79612e;--tint:#f3eacb}
.clay{--accent:#984e37;--tint:#f4e4d9}
.unit-card:hover{border-color:#98a38e;box-shadow:0 3px 9px #243a2d0b;transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:13px}
.symbol-box{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;background:var(--tint);color:var(--accent)}
.symbol-box .ico{width:25px;height:25px;stroke-width:1.55}
.unit-label{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--accent)}
.unit-label strong{font-size:14px;font-family:Georgia,serif;margin-left:4px;font-variant-numeric:tabular-nums}
.card-complete{margin-left:auto;font-size:12px;color:var(--green);display:inline-flex;align-items:center;gap:3px}
.card-complete .ico{width:14px;height:14px}
.chapter-title{font-size:clamp(21px,1.62vw,25px);line-height:1.4;margin:14px 0 5px;font-weight:800;letter-spacing:.025em}
.unit-card p{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 14px}
.card-tail{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e8e7da;margin-top:auto;padding-top:10px;color:var(--accent);font-size:12px;font-weight:600}
.card-tail .ico{width:17px;height:17px}
.footer{border-top:1px solid var(--line);margin-top:34px}
.footer .wrap{padding:18px 0 25px;display:flex;justify-content:space-between;gap:18px;font-size:12px;color:var(--muted)}
.footer span:first-child{font-family:var(--serif);font-weight:750;letter-spacing:.1em}
.breadcrumb{display:flex;align-items:center;gap:7px;min-height:55px;font-size:13px;color:var(--muted)}
.breadcrumb a{display:inline-flex;align-items:center;min-height:44px;text-decoration:underline;text-decoration-color:#b6bdaf;text-underline-offset:3px}
.breadcrumb .ico{width:13px;height:13px}
.reader-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(24px,4.3vw,64px);align-items:start}
.reader-nav{position:sticky;top:15px;padding:6px 18px 14px 0;border-right:1px solid var(--line)}
.reader-nav h2{font-size:23px;margin:0 0 5px}
.reader-nav .map-progress{font-size:12px}
.chapter-list{display:grid;gap:4px;margin-top:13px}
.chapter-list a{padding:10px 7px;display:flex;align-items:center;gap:9px;min-height:45px;font-size:14px;border-radius:6px}
.chapter-list a[aria-current="page"]{background:var(--green);color:white}
.chapter-list a:hover:not([aria-current]){background:#e8ecdd}
.chapter-list .num{font:italic 16px Georgia,serif;opacity:.9}
.chapter-list .ico{width:15px;height:15px;margin-left:auto}
.lesson-header{border-bottom:1px solid var(--line);padding-bottom:18px}
.lesson-header h1,.challenge h1{font-size:clamp(32px,3.15vw,49px);line-height:1.35;margin:8px 0 8px;color:var(--green);letter-spacing:.02em}
.lesson-header>p,.challenge-intro{margin:5px 0 10px;max-width:760px;color:var(--mid);line-height:1.8}
.quicklinks{display:flex;flex-wrap:wrap;gap:2px 18px}
.quicklinks button,.textlink{min-height:44px;display:inline-flex;align-items:center;gap:5px;padding:4px 0;border:0;background:none;color:var(--green);font-weight:650;font-size:14px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#a6b2a2}
.quicklinks .ico,.textlink .ico{width:15px;height:15px}
.chapter-section{margin-top:28px}
.chapter-section h2{margin:0 0 11px;font-weight:750;font-size:25px;letter-spacing:.04em;color:var(--green)}
.jump-target{scroll-margin-block-start:18px}
.cue{margin:0 0 10px;background:#edf0e4;padding:12px 16px;border-left:3px solid #6b8466;color:var(--green);font-size:15px;border-radius:0 4px 4px 0}
.cue strong{margin-right:9px}
.notes{border-top:1px solid var(--line)}
.notes details{border-bottom:1px solid var(--line)}
.notes summary,.source-list summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;list-style:none;font-weight:650;padding:11px 3px}
summary::-webkit-details-marker{display:none}
.notes summary:after,.source-list summary:after{content:"＋";color:var(--green);font-size:18px;flex:none}
.notes details[open]>summary:after,.source-list[open]>summary:after{content:"－"}
.notes details[open]>summary{color:var(--green)}
.notes details p{margin:0 0 15px;padding-right:13px;line-height:1.95;color:#394c41}
.source-list{margin:24px 0 0;border-top:1px dashed var(--line);font-size:14px}
.source-list p{margin:2px 0 4px;color:var(--muted)}.source-list ul{padding-left:20px;margin:6px 0}
.source-list a{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.lesson-foot{margin:20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-box{background:var(--surface);padding:clamp(16px,3vw,30px);border:1px solid var(--line);border-radius:10px}
.quiz-meta{font-size:13px;font-weight:650;letter-spacing:.03em;color:var(--rust);margin:0}
.quiz-title{font-size:clamp(19px,2vw,25px);line-height:1.65;margin:8px 0 15px}
.options{display:grid;gap:8px}
.option{display:flex;align-items:center;text-align:left;gap:12px;width:100%;background:#fffefb;border:1px solid #cdd2c5;border-radius:7px;padding:10px 14px;min-height:49px;font-size:16px;line-height:1.55}
.option .letter{width:26px;min-width:26px;height:26px;display:grid;place-content:center;border:1px solid #d4d8ca;color:var(--mid);border-radius:50%;font:600 13px Georgia,serif}
.option:not(:disabled):hover{border-color:#75917a;background:#f1f3e8}
.option.correct{border-color:#4b7954;background:#eaf2e6}
.option.wrong{border-color:#a46550;background:#fbede5}
.option .state-icon{margin-left:auto}.option.correct .state-icon{color:var(--green)}.option.wrong .state-icon{color:var(--rust)}
.feedback:not(:empty){margin-top:14px;padding:12px 15px;background:#f4f0e2;border-left:3px solid #ab8a5b;border-radius:0 5px 5px 0;line-height:1.7}
.feedback strong{display:block}.feedback.good:not(:empty){background:#eaf1e5;border-color:#6b8a61}.feedback p{margin:3px 0 0}
.quiz-actions{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-top:15px}
.quiz-actions:empty{display:none}
.quiz-step{font-size:13px;color:var(--muted)}
.quiz-note{font-size:14px;color:var(--muted);margin:0 0 12px}
.challenge{max-width:828px;margin:0 auto;padding:10px 0 25px}
.challenge-head{border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:16px}
.challenge .quiz-box{padding:clamp(20px,4vw,38px)}
.coverage{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 21px}
.coverage span{color:var(--mid);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.coverage .ico{width:17px;height:17px}
.quiz-home h2,.finish-title{font-size:27px;color:var(--green);margin:0 0 6px;line-height:1.5}
.quiz-home p{margin:0;color:var(--mid)}
.round-dots{display:flex;gap:5px;margin-bottom:18px}
.round-dots span{flex:1;height:5px;background:#d9ddcf;border-radius:2px}
.round-dots .past{background:#72906b}.round-dots .now{background:var(--rust)}
.result-row{border-bottom:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:start}
.result-row .result-mark{background:#e9efdf;color:var(--green);line-height:1.5;border-radius:4px;padding:2px 7px;font-size:12px}
.result-row .result-mark.miss{background:#f5e5da;color:#863d2a}
.result-row strong{font-weight:650}.result-row p{margin:2px 0;color:var(--mid);font-size:14px}
.review-list{margin:16px 0 20px}.review-list details summary{cursor:pointer;font-weight:600;min-height:42px}
.review-list .textlink{font-size:13px}
@media(max-width:1000px){
  .wrap{width:calc(100% - 64px)}.hero{min-height:345px}.hero-copy{padding:32px 0 32px 34px}.hero-copy>p{font-size:15px}.card-grid{gap:12px}.unit-card{padding:17px}.reader-layout{grid-template-columns:185px minmax(0,1fr);gap:26px}.chapter-list a{font-size:13px}.chapter-title{font-size:21px}
}
@media(max-width:760px){
  .wrap{width:calc(100% - 36px)}.mast-inner{min-height:62px;gap:12px}.mast-sub{display:none}.top-nav{gap:16px}.mast .brand{font-size:21px}
  .hero{grid-template-columns:1.08fr 1fr;min-height:300px;margin:18px 0 26px}.hero-copy{padding:25px 0 25px 24px}.hero h1{font-size:clamp(33px,5.4vw,43px)}.hero-copy>p{margin-bottom:15px;font-size:14px}.actions{gap:7px}
  .hero .btn{padding:8px 12px;font-size:14px}.shop-fig{padding:12px 8px 30px 0}.card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card-top{gap:10px}
  .reader-layout{display:block}.reader-nav{display:none}.lesson-header h1,.challenge h1{font-size:clamp(29px,5.3vw,40px)}.breadcrumb{min-height:45px}.chapter-section{margin-top:23px}
}
@media(max-width:560px){
  .wrap{width:calc(100% - 32px)}.mast-inner{min-height:57px}.brand{gap:7px;letter-spacing:.025em}.mast .brand{font-size:20px}.brand-mark{width:32px;height:32px;border-radius:7px}.brand-mark .ico{width:22px;height:22px}.top-nav{gap:12px}.top-nav a{font-size:12px;gap:4px}.top-nav a[aria-current="page"]:after{bottom:7px}.top-nav .ico{display:none}
  .hero{grid-template-columns:1fr;min-height:0;margin:15px 0 24px;border-radius:10px}.hero-copy{padding:23px 22px 0}.hero h1{font-size:clamp(35px,9.4vw,47px);margin:10px 0}.hero-copy>p{font-size:15px;line-height:1.75;margin:0 0 15px;max-width:none}.hero .btn{padding:8px 15px}
  .shop-fig{width:100%;padding:2px 14px 17px;display:flex;justify-content:flex-end}.shop-fig img{height:clamp(129px,36vw,175px);width:73%;object-position:right center}.shop-fig figcaption{left:22px;right:auto;bottom:13px;font-size:10px;letter-spacing:.04em}.shop-fig figcaption span{display:none}
  .dept-extra{display:none}.map-intro{gap:7px;margin-bottom:12px}.map-intro h2{font-size:28px}.map-progress{font-size:12px;gap:7px}.segment-meter i{width:7px;height:4px}
  .card-grid{grid-template-columns:1fr;gap:10px}.unit-card{display:grid;grid-template-columns:45px minmax(0,1fr) 18px;column-gap:12px;padding:16px 15px;align-items:start}.card-top{display:contents}.symbol-box{grid-area:1/1/4/2;width:43px;height:43px;align-self:start;margin-top:3px}.unit-label{grid-area:1/2;font-size:10px}.unit-label strong{font-size:12px}
  .chapter-title{grid-area:2/2;margin:2px 0 4px;font-size:20px}.unit-card p{grid-area:3/2;margin:0;font-size:13px}.card-tail{grid-area:1/3/4/4;align-self:center;padding:0;margin:0;border:0}.card-tail span{display:none}.card-complete{position:absolute;right:13px;top:8px;font-size:0}
  .chapter-section h2{font-size:23px}.footer{margin-top:23px}.feedback:not(:empty){padding:10px}.option{font-size:15px}.reader-layout article{min-width:0}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

.lab-module {
  --lab-ink:#204d3c;
  --lab-red:#963e2b;
  --lab-edge:#c8d4c5;
  display:block;
  color:#223e32;
  background:#fbfaf5;
  border:1px solid var(--lab-edge);
  border-radius:15px;
  padding:clamp(16px,3.3vw,30px);
  min-width:0;
  line-height:1.65;
}
.lab-module *, .lab-module *::before, .lab-module *::after { box-sizing:border-box; }
.lab-module [hidden] { display:none !important; }
.lab-module .lab-heading { color:var(--lab-ink);padding:0;margin:0 0 .28rem;font-size:clamp(1.16rem,2.3vw,1.5rem);line-height:1.5;letter-spacing:.01em; }
.lab-module .lab-hint { color:#475e50;padding:0;margin:0 0 1rem; }
.lab-module .lab-field { display:block;border:0;padding:0;margin:1rem 0 0;min-width:0; }
.lab-module .lab-legend { padding:0;color:var(--lab-ink);font-size:.88rem;font-weight:700; }
.lab-module .lab-choices { display:flex;flex-wrap:wrap;gap:8px;margin:.4rem 0 0; }
.lab-module .lab-choice {
  appearance:none;margin:0;padding:.45em .85em;min-height:44px;
  width:auto;box-shadow:none;border:1px solid #9cafa0;border-radius:9px;
  font:inherit;font-size:.94rem;font-weight:600;line-height:1.4;
  cursor:pointer;letter-spacing:normal;color:var(--lab-ink);background:#fffefa;
}
.lab-module .lab-choice:hover { background:#e9f0e5;border-color:#6f8975; }
.lab-module .lab-choice[aria-pressed="true"] { color:#fffefa;background:var(--lab-ink);border-color:var(--lab-ink); }
.lab-module .lab-choice:focus-visible,.lab-module .lab-select:focus-visible { outline:3px solid var(--lab-red);outline-offset:3px; }
.lab-module .lab-result {
  margin:1.15rem 0 0;padding:clamp(14px,2.5vw,22px);background:#eaf0e5;
  border-radius:9px;border-inline-start:3px solid #688567;
}
.lab-module .lab-caption { display:block;color:#415d47;font-size:.84rem;font-weight:700; }
.lab-module .lab-answer { display:block;color:var(--lab-ink);font-size:1.18rem;line-height:1.5;margin:.12rem 0 .25rem; }
.lab-module .lab-description,.lab-module .lab-story { margin:0;line-height:1.75;font-size:1rem;color:#293d31; }
.lab-module .lab-story { font-weight:600; }
.lab-module .lab-checks {
  list-style:none;margin:.85rem 0;padding:0;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem .65rem;
}
.lab-module .lab-check { margin:0;display:flex;align-items:center;gap:.45rem;font-size:.93rem; }
.lab-module .lab-check-state { flex:none;background:#d2e4d2;border-radius:4px;padding:.12em .45em;font-size:.77rem;font-weight:700;color:#234a35; }
.lab-module .lab-missing .lab-check-state { background:#f5dfd4;color:#873820; }
.lab-module .lab-select-pair { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem 1.1rem; }
.lab-module .lab-select-label { display:flex;min-width:0;flex-direction:column;gap:.35rem; }
.lab-module .lab-select {
  width:100%;min-width:0;min-height:44px;padding:.5em .35em;
  border:1px solid #9cafa0;border-radius:7px;background:#fffefa;color:var(--lab-ink);
  font:inherit;font-size:.95rem;
}
.lab-module .lab-summary { color:#445b4b;margin:1rem 0 .45rem;font-size:.88rem; }
.lab-module .lab-comparison { table-layout:fixed;width:100%;border-collapse:collapse;line-height:1.65;margin:0; }
.lab-module .lab-comparison thead th {
  border:1px solid #55715a;background:var(--lab-ink);color:#fffefa;text-align:left;
  padding:.6em .7em;font-size:.95rem;
}
.lab-module .lab-row-title { background:#eaf0e5;color:var(--lab-ink);text-align:left;padding:.42em .7em;border:1px solid var(--lab-edge);font-weight:700;font-size:.9rem; }
.lab-module .lab-comparison td { width:50%;vertical-align:top;color:#263d30;background:#fffefa;border:1px solid var(--lab-edge);padding:.65em .75em;font-size:.95rem;overflow-wrap:anywhere; }
.lab-module .lab-route-story {
  margin:1rem 0 .3rem;padding:.7rem .9rem;background:#f2ede1;color:#483f2d;
  border-radius:6px;font-size:1rem;
}
.lab-module .lab-stations .lab-choices { align-items:stretch; }
@media (max-width:540px) {
  .lab-module .lab-choices { gap:8px; }
  .lab-module .lab-choice { font-size:.9rem;padding:.45em .65em; }
  .lab-module .lab-select-pair { gap:.65rem; }
  .lab-module .lab-select { font-size:1rem; }
  .lab-module .lab-comparison td { padding:.55em;font-size:.93rem; }
}
@media (max-width:370px) {
  .lab-module .lab-select-pair { grid-template-columns:1fr; }
  .lab-module .lab-checks { grid-template-columns:1fr; }
}
</style>

<script type="application/json" id="course-data">{"units":[{"ref":"課本第 1-2 頁｜1.1.1 商業的意義與成立要件","title":"什麼情況算是商業活動？","lead":"鳳山的水果店賣出一盒鳳梨，貨運行也從這筆買賣賺到運費。兩家店各做了什麼？","sections":[{"title":"固有商業｜買進，再轉售","body":"水果行向農家進貨，再把鳳梨賣給早餐店或附近居民。這種透過買進、賣出商品來賺取利潤的活動，就是狹義的商業，也叫「固有商業」或「買賣業」。批發和零售都屬於這一類。"},{"title":"輔助商業｜幫一筆生意順利完成","body":"貨運行送鳳梨，冷藏倉庫保鮮，銀行提供周轉金，保險公司承擔契約約定的損失，仲介替買賣雙方牽線。這些業者靠提供服務取得報酬。把這些「輔助商業」加上固有商業，就是課本所說的廣義商業。"},{"title":"條件一、二｜想賺錢，也確實有交換","body":"店主開店想賺利潤，即使今天打折後虧了錢，仍有營利目的。還要有交易，也就是雙方各自提供對方接受的對價。例如設計師用海報設計換取店家的商品，只要雙方同意，沒有現金流動也有交換。純粹免費送水果給鄰居，則只有單方面給予。"},{"title":"條件三、四｜雙方自願，交易合法","body":"顧客看過價錢後願意買，店主也願意賣，才有雙方自願。強迫顧客付款會缺少自願；標的或交易方式違法，則缺少合法性。用這本課本的定義判斷時，營利目的、交易行為、雙方自願與符合法律規範，四項都要成立。"}],"questions":[{"q":"果農把鳳梨賣給水果行。水果行買下後轉售，貨運行只負責載貨。哪個判斷正確？","options":["水果行從事固有商業，貨運行從事輔助商業","兩者都從事固有商業","只有水果行屬於廣義商業"],"answer":0,"why":"水果行靠買賣商品獲利，貨運行靠配送服務賺運費。廣義商業涵蓋這兩種角色。"},{"q":"店主為了獲利開店，某天合法、自願地完成交易，結算卻發現虧損。這筆交易算商業活動嗎？","options":["等以後補足虧損才算","算，營利目的和最後有沒有獲利是兩件事","不算，交易必須真的產生利潤"],"answer":1,"why":"四項條件中的這一項看交易目的。店主打算賺錢，即使結果虧損，仍符合營利目的。"},{"q":"設計工作室與果醬店都以營利為目的，自願且合法地用海報設計服務換取禮盒。這筆交易缺少哪項條件？","options":["缺少交易行為，因為沒有付現","缺少營利目的，因為收到禮盒","四項條件都具備"],"answer":2,"why":"服務和禮盒都是雙方同意的對價。發生交易不要求一定用貨幣支付。"}],"sources":[],"name":"商業的意義與成立","hook":"什麼樣的買賣算商業？","desc":"從店家賣水果、貨運行送貨，分清固有商業與輔助商業。","icon":"store","tone":"sage","cue":"先找出「誰賣了什麼」，再看營利、交換、自願與合法四個條件。","sourceTopic":"商業的意義、範圍與成立要件"},{"ref":"課本第 1-3 頁｜1.1.1 經營要素與生產效用","title":"一罐果醬，怎麼變得有價值？","lead":"果農種鳳梨、工廠熬成果醬、店員收款。這條路上，可以問「經營靠什麼」，也可以問「這一步增加了哪種用途」。","sections":[{"title":"商品與勞動｜顧客買什麼？誰付出心力？","body":"顧客帶走一罐果醬，買的是有形商品；報名手作課，買的是無形服務。從經營要素來看，兩者都是店家銷售的「商品」。師傅煮果醬、店員介紹口味，投入的時間、體力、技術和經驗屬於「勞動」。"},{"title":"資本與信用｜用什麼經營？為什麼借得到？","body":"店裡的資金、攪拌機和冷藏櫃可以投入經營，都是「資本」。可用於營業的專利權和商標權也是資本。供應商信任店家能還款，願意先交貨、下個月收款，這種信任帶來的融通就是「商業信用」。題目若說拿借到的錢買設備，錢和設備屬於資本。"},{"title":"商業組織｜誰把事情統籌起來？","body":"同事分別負責進貨、製作、收款，店家統籌分工、資金與設備，形成以營利為目的的「商業組織」。若題目問小芳收銀時付出的心力，是勞動；若問整個團隊如何分工管理，則是組織。"},{"title":"課本旁註提到的「商譽」","body":"商概題目寫「因商譽良好，供應商同意賒帳」，要抓的線索是能取得商業信用。會計談到企業合併時，商譽有特定認列規則。店家自己累積的好口碑，不能直接當成帳上的商譽金額。"},{"title":"原始生產、形式生產｜材料從哪來？形態怎麼變？","body":"果農栽種、收成果實，從自然取得原料，是原始生產（原料生產），創造原始或本源效用。工廠把鳳梨熬成果醬，原料的形態和用途改變了，是形式生產（工業生產），創造形式效用。"},{"title":"效用生產｜誰能用、何時用、在哪裡用？","body":"商業生產也稱「效用生產」。客人買下果醬，商品換了主人，產生產權（占有）效用；倉庫保存果醬到節慶再供應，產生時間效用；物流把果醬從工廠送到鳳山門市，產生地方（空間）效用。遇到冷藏卡車這類複合情境，看題目強調的是延長保存時間，還是改變所在位置。"},{"title":"勞務生產｜顧客得到什麼服務？","body":"手作課老師指導學生掌握火候，學生付費學到技巧，這項服務創造勞務效用，屬於勞務生產。同樣是在上課，問老師付出的心力是經營要素中的勞動，問學生獲得的教學服務則是勞務效用。"}],"questions":[{"q":"玻璃罐供應商看重店家過去準時付款，答應這批貨可以下月再付款。讓這筆交易成行的是哪個要素？","options":["資本","商品","商業信用"],"answer":2,"why":"供應商信任店家的償付能力，願意先交貨、後收款。題目強調取得延期付款的原因。"},{"q":"老師示範果醬製作方法，學生付費學會控制火候。若題目問「學生得到的效用」，該選哪一項？","options":["勞務效用","形式效用","原始效用"],"answer":0,"why":"學生購買的是老師的教學服務。若題目改問鳳梨煮成果醬這道加工程序，才選形式效用。"},{"q":"店長把已經製好的果醬保存在倉庫，等春節需求增加時再供應。這項安排主要增加哪種效用？","options":["地方效用","時間效用","產權效用"],"answer":1,"why":"讓商品在顧客需要的時候有貨，是倉儲的時間效用。把貨送去另一處才是地方效用，完成買賣換了主人才是產權效用。"}],"sources":[{"label":"會計研究發展基金會｜企業會計準則公報第 18 號第 10 條","url":"https://www.ardf.org.tw/ardf/2025/eas18-2.pdf"}],"name":"經營要素與生產效用","hook":"一顆鳳梨怎麼增加價值？","desc":"跟著鳳梨從採收到上架，看加工、保存和運送各增加什麼效用。","icon":"sprout","tone":"wheat","cue":"問「靠什麼經營」時找經營要素；問「這一步讓商品多了什麼用途」時找生產效用。","sourceTopic":"商業經營的基本要素、生產的種類與創增的效用"},{"ref":"課本 1.1.3｜商業的範圍","title":"賣給誰？誰一起經營？","lead":"兩個人合夥開的水果行也可以做批發。「批發」描述它怎麼賣；「合夥」描述誰出資、誰承擔店裡的債務。","sections":[{"title":"批發與零售｜先看買方拿去做什麼","body":"果品商把鳳梨賣給水果行轉售，或賣給早餐店做成餐點供應客人，是批發的典型情境。居民買回家吃則是零售，一家人買一整箱也一樣。先看買方身分和用途，數量只當參考；要將整間店歸入統計行業，還要看它的主要經濟活動。"},{"title":"專賣與綜合｜看商品的種類","body":"只販售某一系列商品的水果行、文具行或眼鏡行，屬於專賣零售。枋山芒果、金鑽鳳梨和香蕉雖然不同，仍是水果這一系列。同時販售食品、清潔用品、文具等多個系列的超市或便利商店，則屬綜合商品零售。"},{"title":"統計分類的版本","body":"課本旁註引用 2021 年公布的第 11 次修正，共 19 大類。主計總處 2026 年 1 月公布的第 12 次修正共有 20 大類。兩版都把批發及零售業列在 G 大類。"},{"title":"獨資｜一人出資，一人承擔","body":"小安自己出錢開商號，自己決定怎麼經營。業主也能投入設備、勞力，運用自己的信用進貨。獨資商號沒有獨立法人資格；生意資金不夠還債時，債權人可以向業主的個人財產求償，這就是無限責任。轉讓生意由業主決定，仍要依規定辦理手續。"},{"title":"合夥｜共同出資，也共同負責","body":"依民法，至少 2 人約定出資經營共同事業，金錢、財產權、勞務、信用等均可用來出資。這種合夥沒有法人資格。合夥財產還債後若差 6 萬元，債權人可向其中一位合夥人請求這 6 萬元，這叫連帶責任。轉讓給外人要經其他合夥人全體同意；轉給原合夥人則無此限制。獨資與合夥的商業登記由《商業登記法》規範。"},{"title":"有限合夥｜經營與出資有兩種角色","body":"依《有限合夥法》登記後具有社團法人資格，至少各有 1 位普通合夥人與有限合夥人。普通合夥人負責實際經營，可用金錢、其他財產、勞務或信用等出資；組織財產不夠還債時，要對不足額負連帶清償責任。有限合夥人以現金或其他財產出資，原則上不執行業務，以約定的出資額為責任上限。"},{"title":"有限合夥想把出資轉給別人呢？","body":"《有限合夥法》第 19 條讓兩種身分的合夥人都有兩條途徑：依有限合夥契約的約定辦理，或取得其餘全體合夥人同意。比方說契約沒寫轉讓方式，有一名有限合夥人想轉讓，就要取得包括普通合夥人在內的其他每一位合夥人同意。"},{"title":"公司｜先確認類型，再談責任","body":"依《公司法》設立的公司是營利社團法人，能用公司自己的名義承擔權利義務。最低股東人數、可用哪些方式出資，以及股東對債務負多少責任，都要看公司類型。「有法人資格」和「每位出資者都只負有限責任」是兩個不同的問題。"},{"title":"課本練習｜先認出題目用哪一把尺","body":"題幹提到「行業統計分類」，找的是批發及零售業。獨資與合夥回答「怎麼組織」，代理與居間回答「受託做什麼」。就算選項都是學過的名詞，也要先對準題目的分類依據。"}],"questions":[{"q":"居民向水果行買 2 箱鳳梨，在家族聚餐分享。這筆交易屬於什麼？","options":["批發，因為數量超過一箱","零售，因為買方供家人消費","仲介，因為水果來自農場"],"answer":1,"why":"家人是最終消費者。相同的 2 箱鳳梨如果由早餐店進貨供營業使用，則是批發的典型情境。"},{"q":"兩人以民法合夥經營水果行。合夥財產清償貨款後還差 6 萬元。供應商能向其中一人要求多少？","options":["只能要 3 萬元","只能要該人原本的出資額","可以要求剩下的 6 萬元"],"answer":2,"why":"合夥人就不足額對外負連帶清償責任。即使兩人內部約好各分擔一半，債權人仍可向任一人請求剩餘全額。"},{"q":"有限合夥契約沒有約定出資額如何轉讓。一位有限合夥人想轉讓時，要取得誰的同意？","options":["其餘所有合夥人，包括普通合夥人","只要其他有限合夥人","只要一位執行業務的普通合夥人"],"answer":0,"why":"《有限合夥法》第 19 條同時適用普通與有限合夥人。可依契約約定轉讓，或取得其他合夥人全體同意。"}],"sources":[{"label":"主計總處｜行業統計分類第 12 次修正","url":"https://ws.dgbas.gov.tw/001/Upload/463/ebook/ebook_356166/pdf/full.pdf"},{"label":"全國法規資料庫｜商業登記法第 3 至 5 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0080004"},{"label":"法務部｜民法合夥第 667、681、683 條","url":"https://mojlaw.moj.gov.tw/LawContent.aspx?TypeSort=3&lawNumber=667&lsid=fl001351&media=print"},{"label":"全國法規資料庫｜有限合夥法第 4、6、14、19、26 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0080051"}],"name":"批發零售與商業組織","hook":"買一整箱，就算批發嗎？","desc":"改變買家的用途，再看看獨資、合夥和有限合夥如何分擔責任。","icon":"boxes","tone":"clay","cue":"用途決定這筆交易屬於批發或零售。出資人之間的法律關係，決定生意由誰負責。","sourceTopic":"商業的範圍、依行業標準與組織型態分類"},{"title":"公司怎麼分？","lead":"同樣一起開店，有人只願意投入積蓄，有人願意在公司還不出錢時拿自己的財產來還。先辨認股東承擔的責任，再看出資有沒有分成股份。","sections":[{"title":"法人可以用自己的名義租店面","body":"小芸代表「巷口餐飲有限公司」簽租約，承租人是公司。公司依法登記後有自己的法律人格，可以享有權利、負擔義務。「社團法人」以成員為基礎，可以追求營利，例如公司，也可以從事公益，例如依法登記的動保協會。「財團法人」以捐助的財產為基礎，例如一位校友捐出資產，依法設立獎學金基金會，持續資助學生。"},{"title":"公司還差 30 萬元，誰要補？","body":"假設公司欠廠商 50 萬元，用全部公司資產還了 20 萬元，還差 30 萬元。已繳足出資的有限責任股東，通常最多損失投入的錢。若有負連帶無限責任的股東，廠商可以向其中一位要求清償全部 30 萬元，無須先把欠款按人頭平分。這裡假設股東沒有另簽個人保證，也沒有濫用公司法人地位。"},{"title":"從 4 種公司讀懂比較表的 5 欄","body":"股東都負無限責任，對應無限公司。兩種責任的股東各至少有 1 位，對應兩合公司。如果股東都負有限責任，再看資本。有限公司看各人的出資額，股份有限公司把資本分成股份。股份有限公司裡再分一般與閉鎖性，所以同一張表會出現 5 欄。"},{"title":"同樣是 3 個人，可能有 3 票，也可能有 100 票","body":"假設 3 位同學各投 60、30、10 萬元。若成立有限公司，章程沒有另訂時，3 人各有 1 票。若採股份有限公司、每人分別持有 60、30、10 股有表決權的普通股，一般議案就各有 60、30、10 票。題目提到特別股時，要再看章程賦予哪些權利。"},{"title":"過半數要先找分母","body":"有限公司的一般股東要轉讓出資，先排除轉讓者，再數「其他股東的表決權」。若其他人共有 4 票，2 票恰好一半，3 票才過半。如果轉讓人是董事，門檻改成其他股東表決權的三分之二以上。兩合公司則要先辨認轉讓者負哪一種責任，再決定應取得誰的同意。"},{"title":"股份有限公司如何分工、籌資？","body":"股東出資取得股份，股東會可就選任董事、修改章程等重大事項表決。設有董事會時，公司業務原則上由董事會決定，經理人依職權管理日常營運。許多人能一起持股，店務交給經營團隊，便能看出所有權與經營權的分工。一般股份有限公司可依法辦理股票公開發行，也可維持非公開發行。閉鎖性股份有限公司依法屬非公開發行股票公司。"},{"title":"課本練習｜無限公司和一般股份有限公司能自由轉讓嗎？","body":"兩者都有法人資格，股東責任和表決方式卻不同。無限公司的股東想把出資轉給別人，原則上須經其他全體股東同意；已設立的一般股份有限公司，普通股原則上可自由轉讓。所以題目若說「兩者皆可自由轉讓」，就錯在無限公司這一端。"}],"questions":[{"q":"校友捐出一筆財產，依法成立基金會。基金會每年用這筆財產的收益發獎學金。這個組織屬於哪一類？","options":["公益社團法人","財團法人","營利社團法人"],"answer":1,"why":"關鍵線索在「捐出財產成立基金會」。這筆財產是組織的基礎，發獎學金是公益目的。公益社團法人同樣能發獎學金，但它的組成基礎是成員。"},{"q":"小芸已繳足有限公司的 8 萬元出資。公司倒閉後仍欠 30 萬元，小芸沒做個人保證，也沒有濫用公司法人地位。她通常還要用自己的存款補多少？","options":["另外補 8 萬元","另外補 30 萬元","無須另外補款"],"answer":2,"why":"8 萬元是她已投入、可能全數損失的資金。她對公司的出資義務已履行，公司積欠的 30 萬元通常不會再變成她個人的欠款。"},{"q":"一間有限公司按一人一票表決。一般股東阿承想轉讓出資，其他 4 名股東都能投票。至少要拿到幾票同意，才符合過半數門檻？","options":["2 票","3 票","4 票"],"answer":1,"why":"分母是其他股東的 4 票。2 票等於一半，3 票才超過一半。這裡的阿承是一般股東，適用其他股東表決權過半數的門檻。"},{"q":"小晴願意在公司還不出錢時用自己的財產補足。朋友只承擔自己出資的風險。哪種公司能讓兩人分別以這兩種股東身分加入？","options":["兩合公司","無限公司","閉鎖性股份有限公司"],"answer":0,"why":"兩合公司的兩種股東可以共存，小晴是無限責任股東，朋友是有限責任股東。無限公司的股東都負連帶無限責任，閉鎖性股份有限公司的股東則原則上都以認購股份為限。"},{"q":"3 人成立股份有限公司，想在章程中限制普通股轉讓，設立時還希望讓一位夥伴用日後投入的勞務換股。哪一種組織能同時做到？","options":["一般股份有限公司","閉鎖性股份有限公司","無限公司"],"answer":1,"why":"閉鎖性股份有限公司的章程須限制股份轉讓，發起人也能依法以勞務出資。勞務入股還要經全體股東同意、載入章程，並符合股數比例上限。"},{"q":"無限公司清償後仍欠 12 萬元，共有 2 位無限責任股東。債權人可以怎麼做？","options":["向其中 1 位股東請求剩下的 12 萬元","向每人各收 12 萬元，共 24 萬元","只能向每人要 6 萬元"],"answer":0,"why":"連帶責任讓債權人可以向其中一人請求全部不足額。已經清償的部分不能重複收取。"}],"sources":[{"label":"全國法規資料庫｜《公司法》公司種類、出資、責任與股權轉讓","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0080001"},{"label":"法務部《民法》總則編｜社團與財團","url":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL001351&TypeSort=1&lawNumber=1"},{"label":"法務部《財團法人法》第 2 條｜公益及捐助財產","url":"https://mojlaw.moj.gov.tw/LawContent.aspx?LSID=FL089125"},{"label":"司法行政部（61）台函民決字第 07292 號｜兩合公司轉讓出資","url":"https://mojlaw.moj.gov.tw/LawContentExShow.aspx?id=FE074222&media=print&type=E"},{"label":"經濟部｜按組織別查閱各月公司登記家數","url":"https://service.moea.gov.tw/EE521/common/Common.aspx?code=F&no=1"}],"name":"法人與公司類型","hook":"找朋友開店，誰來還債？","desc":"並排比較兩種公司，查清誰能出資、如何投票，以及誰能轉讓。","icon":"building","tone":"clay","cue":"先分清公司和股東，再依序看責任、出資與轉讓。股份有限公司還要分一般與閉鎖性。","sourceTopic":"法人與公司類型之比較、股份有限公司的經營"},{"ref":"EFDB","title":"誰出資？貨物賣到哪裡？","lead":"高雄的果乾店可以同時是民營企業，也可以做國際貿易。「民營」說明資金來自誰，「國際」說明這筆買賣跨越哪裡。先圈出題目要你看的線索。","sections":[{"title":"公營與民營看出資者","body":"阿晴拿自己的積蓄和家人一起開果乾店，資金來自民間，屬民營企業。政府獨資經營的企業則屬公營。題目若說中央政府與民間依《公司法》合資，可看政府資本是否超過 50%。政府出資 51% 符合這項門檻，剛好 50% 則未達。台電與台灣中油都是國營企業。"},{"title":"BOT 的三棒各做什麼？","body":"想像市府與民間簽約興建停車場。Build（興建）是民間投資把停車場蓋好。Operate（營運）是民間依約開放停車、收費並維護設施。Transfer（移轉）是約定營運期間屆滿，把建設的所有權交給政府。台灣高鐵是教材常見的 BOT 案例。"},{"title":"國內與國際貿易看交易兩端","body":"屏東果農把芒果賣給高雄果乾店，交易雙方都在臺灣，屬國內貿易。果乾店把做好的果乾賣給日本超市，就有了國際貿易。即使兩筆都是上網訂貨、都是宅配，決定分類的仍是交易兩端所在的國家或關境。"},{"title":"過境貿易要站在中途地看","body":"臺灣果乾賣給法國商店，因航線安排，貨物先經新加坡換船。臺灣業者出口、法國業者進口，兩地之間進行國際貿易。新加坡只提供中轉，當地業者沒有買下果乾。從新加坡的角度，這批貨屬過境貿易。"}],"questions":[{"q":"中央政府與民間依《公司法》合資，題目只給持股比例。哪個數字已符合「政府資本超過一半」的門檻？","options":["政府持有 49%","政府持有 50%","政府持有 51%"],"answer":2,"why":"「超過 50%」的第一個整數百分比是 51%。50% 恰好一半，沒有超過題目設定的門檻。"},{"q":"民間已經蓋好停車場，現在依約收費、清潔和維修。這是 BOT 的哪一步？","options":["Build 興建","Operate 營運","Transfer 移轉"],"answer":1,"why":"停車場已投入使用，收費和維護屬於營運。約定期間屆滿，再把建設所有權移轉給政府。"},{"q":"臺灣賣家把果乾賣給法國買家，途中在新加坡換船，當地沒有人買下這批貨。從新加坡看是哪一種？","options":["國內貿易","進口供當地銷售","過境貿易"],"answer":2,"why":"找出誰買、誰賣，再找中途點。新加坡只是運輸路線上的中途點，所以從當地角度看屬過境。"}],"sources":[{"label":"《國營事業管理法》第 3 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0120001"},{"label":"經濟部國營事業管理司｜部屬事業","url":"https://www.moea.gov.tw/Mns/cnc/content/Content.aspx?menu_id=10254"},{"label":"《促進民間參與公共建設法》第 8 條","url":"https://law-out.mof.gov.tw/LawContent.aspx?id=GL009096"},{"label":"交通部鐵道局｜台灣高鐵的興建與營運","url":"https://www.rb.gov.tw/zh-TW/main/main_28/20250505_152320/20251104_134001/20250505_180533/"}],"name":"資本來源與貿易區域","hook":"錢從哪來？貨往哪去？","desc":"從公營、民營與 BOT，到一批果乾在不同地點的貿易身分。","icon":"route","tone":"sage","cue":"出資來源、建設營運方式、買賣雙方所在地，是三個各自獨立的判斷方向。","sourceTopic":"依資本來源分類、BOT、依經營區域分類"},{"ref":"D9DB","title":"買下來賣，還是替別人辦？","lead":"同樣把一盒果乾賣出去，有人買進貨品賺價差，有人幫忙找客戶收佣金。先問「貨是誰的？降價損失算誰的？」再看他負責哪件事。","sections":[{"title":"自營商買下貨品，自負盈虧","body":"阿晴用自己的名義進貨，每盒 80 元買斷，打算每盒賣 100 元。賣出一盒的買賣價差是 20 元，還要扣掉店租等成本。若只能賣 70 元，她這一盒的買賣就賠 10 元。持有貨品的所有權、承擔行情變動，是自營商的兩條線索。"},{"title":"經紀商受人委託，賺取報酬","body":"同樣一盒果乾，若店家替果農處理交易，每賣一盒收 8 元服務費，行情漲跌由果農承擔，店家做的是受託服務。課本把這些中介角色合稱經紀商。判斷時要看這一筆交易的約定，即使人員拿過貨、收過貨款，也要問貨品的買賣損益最後歸誰。"},{"title":"代理商（代辦商）以委託人名義代辦","body":"果乾品牌授權阿合在高雄代接訂單。阿合用品牌的名義和店家簽約，按約收佣金。看「代表誰簽」就能辨認代理。"},{"title":"行紀商（牙行）用自己名義替別人交易","body":"果農委託阿合代賣果乾。阿合以「阿合商行」的名義和買方簽約，賣得的貨款扣掉約定手續費後交給果農。看到商行用自己名義時，再問一次「這筆買賣的損益算誰的？」答案仍是果農，因此屬行紀。"},{"title":"居間商（掮客）替雙方牽線","body":"阿合把果農介紹給需要禮盒的公司，兩方自行談價、簽約。阿合依約拿介紹費。判斷線索是「提供訂約機會或媒合」，實際訂約的雙方仍是果農和公司。"},{"title":"承攬商替貨主安排運送","body":"教材此處的「承攬商」是指承攬運送。阿合以自己商行的名義替果農向貨運公司訂車，把 20 箱禮盒送到客人手上，再依約收報酬。題目重點是受託安排運送。只知道一個人開貨車送貨，還要看他究竟是實際運送，還是替貨主安排承運人。"},{"title":"把六個單元串起來｜完成一筆果乾訂單","body":"鳳山果舖由阿晴一人出資設立為有限公司，向工廠買斷果乾，再賣給臺南超市上架。看買方用途，是批發；看貨品盈虧，是自營；看誰出資，是民營；看交易兩端，是國內貿易；看法律組織，是有限公司。一個人出資也能成立有限公司，題目有寫「有限公司」，就不能因為只有一個人而選成「獨資商號」。"}],"questions":[{"q":"店家買斷禮盒，打折賣掉時自行吸收損失。這筆生意屬於哪一類？","options":["行紀商","自營商","居間商"],"answer":1,"why":"「買斷」讓店家取得貨品，「吸收跌價損失」說明盈虧由店家承擔，兩條線索都指向自營。"},{"q":"阿合以自己商行的名義替果農成交，貨款扣掉手續費後交給果農。阿合在這筆交易是誰？","options":["自營商","代理商","行紀商"],"answer":2,"why":"自己具名、替委託人交易、收取服務報酬，是行紀的組合。自營商要承擔買賣的盈虧，代辦商則以委託人名義辦事。"},{"q":"果農和餐廳自行簽約，阿合只介紹兩方認識，依約收介紹費。阿合屬於哪一類？","options":["居間商","代理商","承攬商"],"answer":0,"why":"阿合讓雙方有機會訂約，並由雙方自己簽約，這是居間。若獲授權用果農的名義代簽，才屬於這裡介紹的代理。"},{"q":"阿合用自己的名義，替果農向運輸業者訂好冷藏車並收取報酬。這次受託的是哪一項？","options":["以自己名義代售果乾的行紀","為貨主安排運送的承攬運送","撮合果農與買方的居間"],"answer":1,"why":"先看受託工作。「訂冷藏車」解決的是運輸安排，符合承攬運送。題目沒有請他賣貨或找買方。"},{"q":"甲店大量買斷果乾再賣給超商。依交易對象與用途分類，以及依經營方式分類，分別是什麼？","options":["零售、自營","批發、經紀","批發、自營"],"answer":2,"why":"超商進貨要再賣，所以屬批發。甲店買斷果乾、自負盈虧，所以屬自營。同一筆交易可以依不同線索得到兩個分類。"}],"sources":[{"label":"《民法》第 558 條｜代辦商","url":"https://mojlaw.moj.gov.tw/LawContentExtent.aspx?LSID=FL001351&LawNo=558"},{"label":"《民法》第 576 條｜行紀","url":"https://mojlaw.moj.gov.tw/LawContentExtent.aspx?LSID=FL001351&LawNo=576"},{"label":"《民法》第 565 條｜居間","url":"https://mojlaw.moj.gov.tw/LawContentExtent.aspx?LSID=FL001351&LawNo=565"},{"label":"《民法》第 660 條｜承攬運送","url":"https://mojlaw.moj.gov.tw/LawContentExtent.aspx?LSID=FL001351&LawNo=660"}],"name":"自營商與經紀商","hook":"誰在做自己的生意？","desc":"辨認買斷、代售、牽線和安排運送，看看每筆交易的盈虧歸誰。","icon":"handshake","tone":"wheat","cue":"判斷時問三件事：誰承擔買賣盈虧、受託做什麼、用誰的名義訂約。","sourceTopic":"補充教材：自營商、經紀商與經紀商的類型"}],"compare":{"labels":["有限公司","無限公司","兩合公司","一般股份有限公司","閉鎖性股份有限公司"],"rows":[{"label":"組成與人數","values":["1 位以上股東。自然人也可獨自成立。","至少 2 位股東，全部負無限責任。","至少 1 位無限責任股東，加上至少 1 位有限責任股東。","設立時原則上至少有 2 位發起人。政府或符合法定資格的法人可以單獨發起設立。","最低人數同一般股份有限公司。股東原則上最多 50 位，屬非公開發行股票公司。"]},{"label":"債務責任","values":["各股東原則上以自己的出資額為限。","公司財產不足時，全體股東負連帶無限清償責任。","有限責任股東以其出資額為限。無限責任股東對不足額負連帶無限清償責任。","各股東原則上以所認股份為限。","與一般股份有限公司相同，以所認股份為限。"]},{"label":"出資方式","values":["可用現金、對公司的金錢債權、事業所需的財產或技術。","除了現金、財產，股東也可用勞務或其他權利出資。","無限責任股東可以用勞務出資。有限責任股東可用現金、財產等，法律排除勞務出資。","設立時，發起人可用現金、事業所需的財產或技術。成立後，股東也可依法用對公司的金錢債權抵充出資。一般股份有限公司不接受單憑勞務抵繳股款。","設立時可用現金、所需財產、技術或勞務。以技術或勞務入股須全體股東同意並記入章程，勞務股數另有上限。"]},{"label":"轉讓出資或股份","values":["一般股東轉讓出資，須其他股東表決權過半數同意。董事轉讓須達其他股東表決權三分之二以上。","股東轉讓出資，須其他全體股東同意。","有限責任股東轉讓，須無限責任股東過半數同意。無限責任股東轉讓，須其他全體股東同意，包括有限責任股東。","設立登記後，普通股原則上可自由轉讓。","章程必須寫明股份轉讓限制。例如約定股東須先把股份出售的機會給原股東。"]},{"label":"表決與決策","values":["原則一人一票，章程也可訂成按出資比例分配表決權。","數位股東共同執行業務時按人數決定，原則須過半數同意。變更章程等事項另有門檻。","執行業務由無限責任股東負責，按事項判斷誰有同意權。例如有限責任股東轉讓出資，看無限責任股東人數。","普通股原則一股一票。非公開發行公司也可依法設計複數表決權特別股。","普通股原則一股一票。特別股可依章程一股多票，或對特定事項有否決權。"]},{"label":"課本的登記家數（民國 115 年 1 月）","values":["604,948 家。當月這 4 種公司中家數最多。","7 家。","4 家。當月這 4 種公司中家數最少。","一般與閉鎖性合計 196,486 家。","課本列 7,506 家，已計入股份有限公司合計。"]}]}}</script>
<script>// Interactive exercises for the six lessons. All state belongs to the visible exercise.
function mountLab(host, unitIndex, compare) {
  const panel = document.createElement('section');
  panel.className = 'lab-module';
  host.replaceChildren(panel);

  function node(tag, className, content) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (content !== undefined) element.textContent = content;
    return element;
  }

  function heading(title, hint) {
    panel.setAttribute('aria-label', title);
    panel.append(node('h3', 'lab-heading', title), node('p', 'lab-hint', hint));
  }

  function choices(place, label, items, selected, onChange) {
    const group = node('fieldset', 'lab-field');
    const controls = node('div', 'lab-choices');
    group.append(node('legend', 'lab-legend', label), controls);
    const buttons = items.map((item, i) => {
      const button = node('button', 'lab-choice', item);
      button.type = 'button';
      button.setAttribute('aria-pressed', String(selected === i));
      button.addEventListener('click', () => {
        if (button.getAttribute('aria-pressed') === 'true') return;
        for (const other of buttons) other.setAttribute('aria-pressed', String(other === button));
        onChange(i);
      });
      controls.append(button);
      return button;
    });
    place.append(group);
    return group;
  }

  function resultRegion() {
    const region = node('div', 'lab-result');
    region.setAttribute('aria-live', 'polite');
    region.setAttribute('aria-atomic', 'true');
    panel.append(region);
    return region;
  }

  function report(region, caption, title, description) {
    region.replaceChildren(
      node('span', 'lab-caption', caption),
      node('strong', 'lab-answer', title),
      node('p', 'lab-description', description)
    );
  }

  function criteria() {
    heading('替這筆交易檢查四個要件', '選一種果舖情境，找出它具備哪些條件。');
    const cases = [
      {name:'折價賣果乾', story:'阿晴開店想賺錢。為了出清，她合法地以低於成本的價格賣出果乾，客人同意購買。', yes:[true,true,true,true], reason:'當天虧損也可以有營利目的。這筆買賣具備課本列的四個要件。'},
      {name:'免費送給鄰居', story:'阿晴單純想和鄰居分享自己種的芒果。鄰居樂意收下，不必付錢，也不用回贈。', yes:[false,false,true,true], reason:'這是自願、合法的贈與。阿晴沒有營利意圖，雙方也沒有拿東西互換。'},
      {name:'強迫客人購買', story:'阿晴為了賺錢，以威脅手段強迫客人購買禮盒。客人被迫付了錢、拿了貨。', yes:[true,true,false,false], reason:'雖然有金錢與商品的交換，以威脅手段強迫成交，同時欠缺自願與合法。'},
      {name:'私售禁售商品', story:'阿晴為了獲利，把法令明定禁止販售的商品賣給知情、自願付款的買家。', yes:[true,true,true,false], reason:'兩方都同意付款交貨，仍必須檢查商品及交易方式是否合法。'}
    ];
    choices(panel, '選擇案例', cases.map(c => c.name), 0, render);
    const region = resultRegion();
    function render(i) {
      const c = cases[i];
      const checklist = node('ul', 'lab-checks');
      ['營利目的','交易行為','雙方自願','符合法律規範'].forEach((criterion, idx) => {
        const meets = c.yes[idx];
        const line = node('li', meets ? 'lab-check' : 'lab-check lab-missing');
        line.append(node('span', 'lab-check-state', meets ? '具備' : '欠缺'), document.createTextNode(criterion));
        checklist.append(line);
      });
      region.replaceChildren(
        node('p', 'lab-story', c.story), checklist,
        node('strong', 'lab-answer', c.yes.every(Boolean) ? '符合商業成立要件' : '未符合全部要件'),
        node('p', 'lab-description', c.reason)
      );
    }
    render(0);
  }

  function production() {
    heading('追蹤一批鳳梨的旅程', '點選一個環節，看這一步為誰增加了什麼用途。');
    const stops = [
      ['採收','原始生產','原始（本源）效用','果農種植、採收鳳梨。這一步從自然取得果實，讓後續的加工有了原料。'],
      ['熬果醬','形式生產','形式效用','工廠把鳳梨切碎、熬成果醬。原料的形態與用途改變了。'],

  function wholesale() {

      ['餐廳製作餐點','餐廳買來切碎，做成菜單上的甜點','批發','餐廳把果乾用於營業，製成甜點供顧客購買。']

  function companies() {
    heading('把兩種公司放在一起看', '各選一種公司，逐項比較。選到另一欄正在看的公司時，兩欄會互換。');

      const select = node('select', 'lab-select');

      select.value = String(pair[side]);
      select.addEventListener('change', () => {
        const next = Number(select.value);
        const other = 1 - side;
        if (next === pair[other]) pair[other] = pair[side];
        pair[side] = next;
        render();
      });
      label.append(node('span', 'lab-legend', name), select);
      set.append(label);

      selectors.forEach((s, i) => s.value = String(pair[i]));
      announcement.textContent = '比較' + compare.labels[pair[0]] + '與' + compare.labels[pair[1]] + '，共 ' + compare.rows.length + ' 項。';

        for (const index of pair) values.insertCell().textContent = item.values[index];

  function trade() {
    heading('沿著貨運路線，換個位置看', '先選一筆買賣，再點路線上的地點。看看同一批貨，在不同地方叫什麼。');

      {name:'國內配送', story:'屏東果農把鳳梨賣給高雄果舖，由貨車直接送達。', stops:[
        ['屏東','賣方','國內貿易','果農在臺灣出售，買方也在臺灣，這筆買賣在同一國內完成。'],
        ['高雄','買方','國內貿易','果舖向屏東果農進貨，運輸跨縣市，交易兩端仍在臺灣。']]},
      {name:'跨國直運', story:'臺灣果舖把果乾賣給日本超市，貨物從臺灣直接送去日本。', stops:[

        ['日本','買方','進口貿易','從日本買家的角度，商品由國外購入，是國際貿易中的進口。']]},
      {name:'經第三地中轉', story:'臺灣果舖把果乾賣給法國商店。貨物在新加坡換船，當地沒有人買下或轉賣果乾。', stops:[
        ['臺灣','賣方','出口貿易','果乾由臺灣出口，交易對象是法國買家。即使中途換船，買賣雙方也沒改變。'],
        ['新加坡','中途','過境貿易','新加坡只讓貨物借道換船。從中途地看，貨物經過當地，再送往最終買家。'],
        ['法國','買方','進口貿易','法國商店向臺灣果舖買入果乾，從法國看是進口。新加坡是運輸中途點。']]}
    ];
    let route = 2;
    let perspective = 1;
    choices(panel, '交易路線', routes.map(r => r.name), route, i => {
      route = i;
      perspective = i === 2 ? 1 : 0;
      drawRoute();
    });
    const story = node('p', 'lab-route-story');
    const stations = node('div','lab-stations');
    panel.append(story, stations);
    const region = resultRegion();
    function drawRoute() {
      story.textContent = routes[route].story;
      stations.replaceChildren();
      choices(stations, '選擇觀察地點', routes[route].stops.map(s => s[0] + '（' + s[1] + '）'), perspective, i => {
        perspective = i;
        updateView();
      });

    }

      const s = routes[route].stops[perspective];
      report(region, '站在' + s[0] + '看', s[2], s[3]);

  function intermediaries() {
    heading('派工作給果舖夥伴', '換一項工作。選到「受託代賣」時，試著改一改簽約用的名義。');
    const work = ['買斷再賣','受託代賣','介紹買賣雙方','替貨主安排運送'];
    const names = ['果農的名義','自己的商號名義'];
    let action = 1;
    let as = 0;
    const jobs = [
      ['負擔庫存與跌價風險','自營商','阿合用自己的名義買下果乾，再決定賣價。賺到的價差及賣不掉的損失都算阿合的。'],
      null,
      ['由雙方自行簽約','居間商（掮客）','阿合介紹果農和超市認識，由他們商量條件、簽約。阿合依約收取介紹費。'],
      ['以自己名義安排貨運','承攬商（承攬運送）','阿合替果農向貨運公司訂車，收取報酬；果乾的買賣損益仍由貨主負擔。']
    ];
    const sales = [
      ['以委託人名義交易','代理商（代辦商）','果農授權阿合用果農的名義向超市接單。阿合替果農辦理交易，依約收取佣金。'],
      ['以自己名義為他人交易','行紀商（牙行）','阿合用自己商號的名義替果農和超市成交，買賣損益歸果農，阿合收取手續費。']
    ];
    choices(panel, '工作內容', work, action, i => { action = i; render(); });
    const signature = choices(panel, '如果受託代賣，以誰的名義簽約？', names, as, i => { as = i; render(); });
    const region = resultRegion();
    function render() {
      signature.hidden = action !== 1;
      const job = action === 1 ? sales[as] : jobs[action];
      report(region, job[0], job[1], job[2]);
    }
    render();
  }

  [criteria, production, wholesale, companies, trade, intermediaries][unitIndex]();
}

(() => {
  'use strict';
  const {units, compare} = JSON.parse(document.querySelector('#course-data').textContent);
  const el = id => document.getElementById(id);
  const icon = (name, extra = '') => '<svg aria-hidden="true" class="ico '+extra+'"><use href="#i-'+name+'"/></svg>';
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const read = key => {
    try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
  };
  let canSave = true;
  function save(key,value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch { canSave = false; }
  }
  const progressKey = 'alley-commerce:mastery:v1';
  const challengeKey = 'alley-commerce:challenge:v1';
  const saved = read(progressKey);
  const mastery = units.map((u,i) => new Set(Array.isArray(saved?.[i])
    ? saved[i].filter(n => Number.isInteger(n) && n >= 0 && n < u.questions.length) : []));
  const done = i => mastery[i].size === units[i].questions.length;
  const doneCount = () => units.filter((_,i) => done(i)).length;
  const idxToVisit = () => {
    const started = units.findIndex((_,i) => mastery[i].size && !done(i));
    return started >= 0 ? started : Math.max(0,units.findIndex((_,i) => !done(i)));
  };
  function progressMeter(){
    const count=doneCount();
    const bars=units.map((_,i) => '<i class="'+(done(i)?'filled':'')+'"></i>').join('');
    return '<span>已完成 <b>'+count+'</b> / '+units.length+' 單元</span><span class="segment-meter" aria-hidden="true">'+bars+'</span>';
  }
  function updateHome(){
    el('map-progress').innerHTML = progressMeter();
    const hasProgress = mastery.some(s=>s.size);
    el('begin').href = '#unit-'+(idxToVisit()+1);
    el('begin').querySelector('span').textContent = doneCount()===units.length ? '從頭複習' : hasProgress ? '繼續學習' : '開始學習';
    el('unit-cards').innerHTML = units.map((u,i) =>
      '<a class="unit-card '+u.tone+'" href="#unit-'+(i+1)+'"><div class="card-top"><span class="symbol-box">'+icon(u.icon)+'</span><span class="unit-label">單元 <strong>'+pad(i+1)+'</strong></span>'+
      (done(i)?'<span class="card-complete">'+icon('check')+'已完成</span>':'')+'</div>'+
      '<h3 class="chapter-title">'+escape(u.name)+'</h3><p>'+escape(u.desc)+'</p><div class="card-tail"><span>進入單元</span>'+icon('arrow')+'</div></a>'
    ).join('');
  }
  const breadcrumb = name => '<div class="breadcrumb"><a href="#home">學習地圖</a>'+icon('chevron')+'<span>'+name+'</span></div>';
  function sideLinks(active){
    return '<h2>學習地圖</h2><div class="map-progress">'+progressMeter()+'</div><nav class="chapter-list" aria-label="選擇單元">'+
      units.map((u,i)=>'<a href="#unit-'+(i+1)+'" '+(active===i?'aria-current="page"':'')+'><span class="num">'+pad(i+1)+'</span>'+escape(u.name)+(done(i)?icon('check'):'')+'</a>').join('')+'</nav>';
  }
  const focusHeading = element => element.focus({preventScroll:true});
  function gotoPart(id) {

    focusHeading(node);
  }
  function showLesson(i){
    const u=units[i];
    el('reader-view').innerHTML=breadcrumb('單元 '+pad(i+1))+
      '<div class="reader-layout"><aside class="reader-nav" id="sidebar">'+sideLinks(i)+'</aside><article>'+
      '<header class="lesson-header"><div class="eyebrow"><span class="ink-line"></span>單元 '+pad(i+1)+'<span class="small-dot"></span>'+escape(u.name)+'</div>'+

      '<section class="chapter-section"><h2 class="jump-target" tabindex="-1" id="lab-heading">動手試試</h2><div id="lab-holder"></div></section>'+
      '<section class="chapter-section"><h2 class="jump-target" tabindex="-1" id="notes-heading">概念拆解</h2><p class="cue"><strong>判斷線索</strong>'+escape(u.cue)+'</p>'+
      '<div class="notes">'+u.sections.map((s,n)=>'<details'+(n===0?' open':'')+'><summary>'+escape(s.title)+'</summary><p>'+escape(s.body)+'</p></details>').join('')+'</div></section>'+
      '<section class="chapter-section"><h2 class="jump-target" tabindex="-1" id="quiz-heading">隨堂練習</h2><p class="quiz-note" id="unit-note"></p><div class="quiz-box" id="unit-quiz"></div></section>'+
      '<details class="source-list"><summary>教材與查閱資料</summary><p>對照課本「'+escape(u.sourceTopic)+'」。'+(u.sources.length?'下列資料可連線查閱。':'')+'</p>'+
      (u.sources.length?'<ul>'+u.sources.map(s=>'<li><a target="_blank" rel="noopener noreferrer" href="'+escape(s.url)+'">'+escape(s.label)+'</a></li>').join('')+'</ul>':'')+'</details>'+
      '<nav class="lesson-foot" aria-label="單元導覽"><a href="#home" class="textlink">'+icon('back')+'回學習地圖</a>'+
      (i+1<units.length?'<a href="#unit-'+(i+2)+'" class="btn outline">下一單元'+icon('arrow')+'</a>':'<a href="#challenge" class="btn outline">進入情境挑戰'+icon('arrow')+'</a>')+'</nav></article></div>';

    showUnitQuestion(i,next<0?0:next);
  }
  function quizMarkup(q,meta){
    return '<p class="quiz-meta">'+meta+'</p><h3 class="quiz-title" tabindex="-1">'+escape(q.q)+'</h3>'+
      '<div class="options">'+q.options.map((label,k)=>'<button class="option" type="button" data-option="'+k+'"><span class="letter" aria-hidden="true">'+String.fromCharCode(65+k)+'</span><span>'+escape(label)+'</span></button>').join('')+'</div>'+
      '<div class="feedback" aria-live="polite" aria-atomic="true"></div><div class="quiz-actions"></div>';
  }
  function updateFeedback(box,q,chosen,mode){
    const ok=chosen===q.answer;
    const locked=ok || mode==='challenge';
    const buttons=[...box.querySelectorAll('.option')];
    buttons.forEach((b,n)=>{
      b.disabled=locked;
      b.classList.toggle('correct',locked && n===q.answer);
      b.classList.toggle('wrong',!ok && n===chosen);
      b.querySelector('.state-icon')?.remove();
      if(locked && n===q.answer) b.insertAdjacentHTML('beforeend',icon('check','state-icon'));
      if(!ok && n===chosen) b.insertAdjacentHTML('beforeend',icon('close','state-icon'));
    });
    const feedback=box.querySelector('.feedback');
    feedback.classList.toggle('good',ok);
    const lead=ok?'答對了！':(mode==='challenge'?'這題的答案是「'+q.options[q.answer]+'」。':'再想一次，看看這個線索。');
    feedback.innerHTML='<strong>'+escape(lead)+'</strong><p>'+escape(q.why)+'</p>';
  }
  function showUnitQuestion(unitIdx,qIdx,focus=false){
    const u=units[unitIdx],q=u.questions[qIdx],box=el('unit-quiz');
    box.innerHTML=quizMarkup(q,'第 '+(qIdx+1)+' 題 / 共 '+u.questions.length+' 題');
    function updateNote(){
      el('unit-note').textContent='本單元已答對 '+mastery[unitIdx].size+' / '+u.questions.length+' 題。'+
        (done(unitIdx)?'已完成，可再次練習。':canSave?'全部答對即可完成單元，進度保存在此瀏覽器。':'此瀏覽器未開放儲存，進度會保留到本次關閉為止。');
    }
    updateNote();
    box.querySelector('.options').addEventListener('click',e=>{
      const b=e.target.closest('[data-option]');
      if(!b || b.disabled) return;
      const ans=Number(b.dataset.option);
      updateFeedback(box,q,ans,'unit');
      if(ans!==q.answer) return;
      mastery[unitIdx].add(qIdx);
      save(progressKey,mastery.map(set=>[...set]));
      updateNote();
      el('sidebar').innerHTML=sideLinks(unitIdx);
      const actions=box.querySelector('.quiz-actions');
      if(qIdx<u.questions.length-1){
        actions.innerHTML='<span class="quiz-step">已掌握這一題</span><button class="btn primary">下一題'+icon('arrow')+'</button>';
        actions.querySelector('button').onclick=()=>showUnitQuestion(unitIdx,qIdx+1,true);
      }else{
        const missing=u.questions.findIndex((_,j)=>!mastery[unitIdx].has(j));
        if(missing>=0){
          actions.innerHTML='<span class="quiz-step">繼續完成尚未答對的題目</span><button class="btn primary">繼續練習'+icon('arrow')+'</button>';
          actions.querySelector('button').onclick=()=>showUnitQuestion(unitIdx,missing,true);
        }else{
          actions.innerHTML='<button class="textlink">再練這個單元</button><a class="btn primary" href="'+(unitIdx<5?'#unit-'+(unitIdx+2):'#challenge')+'">'+(unitIdx<5?'下一單元':'挑戰綜合題')+icon('arrow')+'</a>';
          actions.querySelector('button').onclick=()=>showUnitQuestion(unitIdx,0,true);
        }
      }
    });
    if(focus){box.scrollIntoView({block:'start'});focusHeading(box.querySelector('.quiz-title'));}
  }
  function validRound(value){
    if(!value || !Array.isArray(value.picks) || value.picks.length!==units.length || !Array.isArray(value.answers) || value.answers.length>units.length) return false;
    const indexed=value.picks.every((n,i)=>Number.isInteger(n) && n>=0 && n<units[i].questions.length);
    return indexed && value.answers.every((n,i)=>Number.isInteger(n) && n>=0 && n<units[i].questions[value.picks[i]].options.length) &&
      Number.isInteger(value.pos) && value.pos>=0 && value.pos<=units.length &&
      (value.answers.length===value.pos || value.answers.length===value.pos+1);
  }
  let round=read(challengeKey);
  if(!validRound(round)) round=null;
  function newRound(){
    const old=round;
    round={picks:units.map((u,i)=>{
      const available=u.questions.map((_,k)=>k).filter(k=>!old || k!==old.picks[i] || u.questions.length===1);
      return available[Math.floor(Math.random()*available.length)];
    }),answers:[],pos:0};
    save(challengeKey,round);
  }
  function showChallenge(focus=false){
    if(!round) newRound();
    el('challenge-view').innerHTML=breadcrumb('情境挑戰')+'<section class="challenge"><header class="challenge-head"><div class="eyebrow"><span class="ink-line"></span>全章複習</div>'+

    if(round.pos===units.length){

        '<p class="quiz-note">'+(total===units.length?'你已能在六種情境裡找到判斷線索。':'展開題目，比對你的答案和解題線索。')+'</p><div class="review-list">'+
        units.map((u,i)=>{
          const q=u.questions[round.picks[i]],chosen=round.answers[i],ok=chosen===q.answer;
          return '<div class="result-row"><span class="result-mark '+(ok?'':'miss')+'">'+(ok?'答對':'答錯')+'</span><details'+(ok?'':' open')+'><summary>'+pad(i+1)+'　'+escape(u.name)+'</summary><strong>'+escape(q.q)+'</strong><p>你的答案　'+escape(q.options[chosen])+'</p>'+
            (!ok?'<p>正確答案　'+escape(q.options[q.answer])+'</p>':'')+'<p>'+escape(q.why)+'</p><a class="textlink" href="#unit-'+(i+1)+'">複習這個單元'+icon('arrow')+'</a></details></div>';
        }).join('')+'</div><div class="actions"><button id="again" class="btn primary">換一組題目'+icon('arrow')+'</button><a class="btn outline" href="#home">回學習地圖</a></div>';
      el('again').onclick=()=>{newRound();showChallenge(true);};
      if(focus){box.scrollIntoView();focusHeading(box.querySelector('h2'));}
      return;
    }
    const i=round.pos,q=units[i].questions[round.picks[i]];
    box.innerHTML='<div class="round-dots" aria-hidden="true">'+units.map((_,k)=>'<span class="'+(k<i?'past':k===i?'now':'')+'"></span>').join('')+'</div>'+
      quizMarkup(q,'第 '+(i+1)+' / '+units.length+' 題　・　'+escape(units[i].name));
    function review(ans){
      updateFeedback(box,q,ans,'challenge');
      const bar=box.querySelector('.quiz-actions');
      bar.innerHTML='<span class="quiz-step">作答已記錄</span><button class="btn primary">'+(i===units.length-1?'查看結果':'下一題')+icon('arrow')+'</button>';
      bar.querySelector('button').onclick=()=>{round.pos++;save(challengeKey,round);showChallenge(true);};
    }
    if(round.answers.length>i) review(round.answers[i]);
    box.querySelector('.options').onclick=e=>{
      const b=e.target.closest('[data-option]');
      if(!b || b.disabled || round.answers.length>i) return;
      const ans=Number(b.dataset.option);
      round.answers.push(ans); save(challengeKey,round); review(ans);
    };
    if(focus){box.scrollIntoView({block:'start'});focusHeading(box.querySelector('.quiz-title'));}
  }
  function route(focus=false){
    const name=location.hash.slice(1);
    const match=/^unit-([1-6])$/.exec(name);
    const challenge=name==='challenge',home=!match && !challenge;
    el('home-view').hidden=!home; el('reader-view').hidden=!match; el('challenge-view').hidden=!challenge;
    for(const id of ['home-link','challenge-link']) el(id).removeAttribute('aria-current');
    if(home) el('home-link').setAttribute('aria-current','page');
    if(challenge) el('challenge-link').setAttribute('aria-current','page');
    if(home) updateHome();
    else if(match) showLesson(Number(match[1])-1);
    else showChallenge();
    document.title=(home?'從一間果舖，讀懂商業概論':challenge?'果舖情境挑戰':units[Number(match[1])-1].name)+'｜巷口商學堂';
    if(focus){
      const heading=home?el('home-title'):document.querySelector((challenge?'#challenge-view':'#reader-view')+' .view-title');
      if(home)heading.tabIndex=-1;
      focusHeading(heading);window.scrollTo(0,0);
    }
  }
  el('skip').onclick=e=>{e.preventDefault();el('main-content').focus();};
  window.addEventListener('hashchange',()=>route(true));
  route();
})();
</script>
</body></html>
